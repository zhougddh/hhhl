<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小禾 AI 音色工具箱</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100vh}
body{
    background:url(https://p3-flow-image-sign.byteimg.com/tos-cn-i-a9r32ns0r0/1761611711199111696.jpg) no-repeat center center;
    background-size:cover;background-attachment:fixed;background-color:#0a0f27;
    font-family:sans-serif;padding:40px 20px;margin:0
}
.box{max-width:580px;margin:0 auto;background:transparent;padding:35px 25px;border-radius:20px}
h1{text-align:center;font-size:42px;color:#fff;margin-bottom:30px}
input{width:100%;padding:16px 18px;margin:12px 0;border:2px solid #ddd;border-radius:12px;font-size:17px;background:rgba(255,255,255,0.9)}
#apiKey{border-color:#e6a23c}
button{width:100%;padding:20px;margin:11px 0;border:none;border-radius:14px;color:#fff;font-size:21px;font-weight:600}
.btn1{background:#409eff}
.btn2{background:#67c23a}
.btn3{background:#e6a23c}
.btn4{background:#f56c6c}
.btn-kefu{background:#7928ca;margin-top:10px}
#logBox{width:100%;min-height:180px;background:rgba(255,255,255,0.85);border-radius:14px;margin-top:25px;padding:20px;white-space:pre-wrap;font-size:16px;line-height:1.7}
.delConfirmRow{display:flex;gap:10px;margin:15px 0}
.btnYes{background:#f56c6c;width:50%}
.btnNo{background:#909399;width:50%}
</style>
</head>
<body>
<div class="box">
    <h1>🎵 小禾 AI 音色工具箱</h1>
    <input type="text" id="apiKey" placeholder="输入API Key">
    <input type="text" id="customName" placeholder="自定义音色名称（上传前填写）">
    <input type="text" id="voiceId" placeholder="音色ID">
    <button class="btn1" onclick="uploadVoice()">1. 上传音色</button>
    <button class="btn2" onclick="queryVoice()">2. ID查询音色</button>
    <button class="btn3" onclick="showDelConfirm()">3. 删除音色</button>
    <button class="btn4" onclick="loadAll()">4. 加载全部</button>
    <button class="btn-kefu" onclick="addQQ()">📞 联系客服</button>
    <div id="delConfirmArea" class="delConfirmRow" style="display:none">
        <button class="btnYes" onclick="confirmDelete()">✅ 确认永久删除</button>
        <button class="btnNo" onclick="cancelDelete()">❌ 取消</button>
    </div>
    <div id="logBox">等待操作...</div>
</div>
<script>
const API_HOST = "https://api.302ai.cn";
function log(t){document.getElementById("logBox").textContent = t}

function addQQ(){
    window.open("https://qm.qq.com/q/RNPgd1P3Wg", "_blank");
}

async function uploadVoice(){
    const key = document.getElementById("apiKey").value.trim();
    const customName = document.getElementById("customName").value.trim();
    if(!key){log("⚠️ 请先填写API Key");return}
    if(!customName){log("⚠️ 请先填写音色名称");return}
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "audio/*";
    inp.onchange = async e=>{
        const file = e.target.files[0]; if(!file) return;
        log("正在上传...");
        const fd = new FormData();
        fd.append("type","tts");
        fd.append("title", customName);
        fd.append("train_mode","fast");
        fd.append("visibility","private");
        fd.append("voices", file);
        try{
            const res = await fetch(`${API_HOST}/fish-audio/model`,{
                method:"POST",headers:{Authorization:"Bearer "+key},body:fd
            });
            const data = await res.json();
            navigator.clipboard.writeText(data._id);
            log(`✅ 上传成功\n名称：${customName}\nID：${data._id}\n✅ ID已自动复制`);
        }catch{
            log("上传完成，请加载列表查看结果");
        }
    };inp.click();
}

async function queryVoice(){
    const key = document.getElementById("apiKey").value.trim();
    const id = document.getElementById("voiceId").value.trim();
    if(!key){log("⚠️ 请先填写API Key");return}
    if(!id){log("⚠️ 请输入音色ID");return}
    log("正在查询...");
    try{
        const res = await fetch(`${API_HOST}/fish-audio/model/${id}`,{headers:{Authorization:"Bearer "+key}});
        const data = await res.json();
        const state = data.state==="trained"?"✅ 已完成":data.state==="training"?"⚙️ 训练中":"⏳ 排队中";
        log(`名称：${data.title}\n状态：${state}\nID：${data._id}`);
    }catch{log("❌ 请求失败");}
}

function showDelConfirm(){
    const id = document.getElementById("voiceId").value.trim();
    if(!id){log("⚠️ 请输入音色ID");return}
    log(`即将删除ID：${id}\n请确认`);
    document.getElementById("delConfirmArea").style.display = "flex";
}
async function confirmDelete(){
    document.getElementById("delConfirmArea").style.display = "none";
    const key = document.getElementById("apiKey").value.trim();
    const id = document.getElementById("voiceId").value.trim();
    log("正在删除...");
    try{
        await fetch(`${API_HOST}/fish-audio/model/${id}`,{method:"DELETE",headers:{Authorization:"Bearer "+key}});
        log("✅ 删除成功，音色已永久移除");
    }catch{log("✅ 删除指令已执行，请刷新列表核对");}
}
function cancelDelete(){
    document.getElementById("delConfirmArea").style.display = "none";
    log("已取消删除");
}

async function loadAll(){
    const key = document.getElementById("apiKey").value.trim();
    if(!key){log("⚠️ 请填写API Key");return}
    log("正在加载全部音色...");
    let list = [], page = 1;
    while(true){
        try{
            const res = await fetch(`${API_HOST}/fish-audio/model?page_size=50&page_number=${page}`,{headers:{Authorization:"Bearer "+key}});
            if(!res.ok) break;
            const data = await res.json();
            if(!data.items?.length) break;
            list.push(...data.items); page++;
        }catch{break;}
    }
    if(!list.length){log("暂无音色数据");return}
    let txt = `✅ 共 ${list.length} 个音色\n\n`;
    list.forEach((it,i)=>{
        const s = it.state==="trained"?"✅已完成":it.state==="training"?"⚙️训练中":"⏳排队";
        txt += `${i+1}. ${it.title}\nID:${it._id}\n状态:${s}\n\n`;
    });
    log(txt);
}
</script>
</body>
</html>
