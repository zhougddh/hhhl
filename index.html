<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小禾 AI 音色工具箱</title>
<style>
:root{
    --bg-main:#f8faff;
    --bg-soft:#f0f4ff;
    --glass-white:rgba(255,255,255,0.72);
    --glass-border:rgba(190,210,255,0.45);
    --text-dark:#1a2240;
    --text-sub:#56608a;
    --input-bg:rgba(255,255,255,0.85);
    --primary:#437aff;
    --accent-purple:#906aff;
    --accent-pink:#ff7eb6;
    --success:#36c997;
    --danger:#ff5975;
    --gray-btn:rgba(230,238,255,0.7);
    --shadow-card:0 16px 48px rgba(100,130,230,0.12);
    --shadow-card-inner-top:inset 0 1px 0 rgba(255,255,255,0.9);
    --shadow-btn:0 8px 20px rgba(67,122,255,0.16);
    --motion:all 0.24s cubic-bezier(0.2,0,0.2,1);
}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
}
html,body{
    min-height:100vh;
}
body{
    background:
        radial-gradient(circle at 10% 12%, rgba(67, 122, 255, 0.12), transparent 35%),
        radial-gradient(circle at 90% 15%, rgba(144, 106, 255, 0.09), transparent 40%),
        radial-gradient(circle at 50% 90%, rgba(255, 126, 182, 0.06), transparent 45%),
        linear-gradient(145deg, var(--bg-main), var(--bg-soft));
    background-attachment:fixed;
    font-family:system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    padding:18px 14px;
    color:var(--text-dark);
    position:relative;
    overflow-x:hidden;
}
body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:url("data:image/svg+xml,%3Csvg width='200' height='200' viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.45' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.025'/%3E%3C/svg%3E");
    pointer-events:none;
    z-index:0;
}
.glass-card{
    position:relative;
    z-index:1;
    background:var(--glass-white);
    backdrop-filter:blur(32px);
    -webkit-backdrop-filter:blur(32px);
    border:1px solid var(--glass-border);
    border-radius:36px;
    padding:40px 34px;
    max-width:580px;
    margin:22px auto;
    box-shadow:var(--shadow-card-inner-top), var(--shadow-card);
    transition:var(--motion);
}
.glass-card:hover{
    transform:translateY(-5px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.95), 0 22px 60px rgba(100,130,230,0.16);
}
.box{
    max-width:580px;
    margin:0 auto;
    padding:12px;
    position:relative;
    z-index:1;
}
h1,h2{
    text-align:center;
    font-size:40px;
    font-weight:500;
    margin-bottom:36px;
    color:var(--text-dark);
    letter-spacing:0.4px;
}
.tab-group{
    display:flex;
    border-radius:28px;
    overflow:hidden;
    background:rgba(220,230,255,0.4);
    margin-bottom:32px;
}
.tab-item{
    flex:1;
    text-align:center;
    padding:24px 0;
    color:var(--text-sub);
    cursor:pointer;
    font-weight:500;
    transition:var(--motion);
    font-size:20px;
}
.tab-item.active{
    background:#fff;
    color:var(--primary);
    box-shadow:0 2px 10px rgba(67,122,255,0.12);
}
.tab-item:hover:not(.active){
    background:rgba(255,255,255,0.4);
}
input{
    width:100%;
    padding:22px 28px;
    margin:18px 0;
    background:var(--input-bg);
    border:1px solid var(--glass-border);
    border-radius:24px;
    color:var(--text-dark);
    font-size:18px;
    outline:none;
    transition:var(--motion);
}
input:focus{
    border-color:rgba(67,122,255,0.65);
    box-shadow:0 0 0 5px rgba(67,122,255,0.1);
}
input::placeholder{
    color:var(--text-sub);
    opacity:0.65;
}
.code-row{
    display:flex;
    gap:16px;
    align-items:center;
    margin:18px 0;
}
.code-row input{
    flex:1;
    margin:0;
}
.code-img-box{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
}
#loginCodeCanvas,#regCodeCanvas{
    width:130px;
    height:52px;
    background:linear-gradient(135deg,#e8f0ff,#dce8ff);
    border-radius:12px;
    border:1px solid rgba(180,200,245,0.5);
}
.code-refresh{
    font-size:14px;
    color:var(--primary);
    cursor:pointer;
    text-decoration:underline;
}
button{
    width:100%;
    padding:22px;
    margin:18px 0;
    border:none;
    border-radius:24px;
    color:#ffffff;
    font-size:18px;
    font-weight:500;
    cursor:pointer;
    transition:var(--motion);
    box-shadow:var(--shadow-btn);
}
button:active{
    transform:scale(0.95) translateY(4px);
    filter:brightness(0.92);
    box-shadow:0 4px 12px rgba(67,122,255,0.08);
}
.btn-blue{background:linear-gradient(135deg,#437aff,#3060e8);}
.btn-purple{background:linear-gradient(135deg,#906aff,#7444e6);}
.btn-green{background:linear-gradient(135deg,#36c997,#24a87c);}
.btn-red{background:linear-gradient(135deg,#ff5975,#e83c5c);}
.btn-gray{background:var(--gray-btn); color:var(--text-sub); box-shadow:none;}
.del-row{display:flex;gap:20px;margin:24px 0;}
.del-row button{width:50%;}
#logBox{
    width:100%;min-height:190px;background:rgba(255,255,255,0.85);
    border-radius:24px;margin-top:32px;padding:28px;
    white-space:pre-wrap;font-size:14px;color:var(--text-dark);line-height:1.85;
}
.modal-wrap{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.25);display:flex;align-items:center;justify-content:center;
    z-index:9999;
}
.modal-content{
    background:rgba(255,255,255,0.88);
    backdrop-filter:blur(36px);border:1px solid var(--glass-border);
    border-radius:32px;padding:38px 32px;width:90%;max-width:440px;text-align:center;
    box-shadow:0 30px 80px rgba(80,110,210,0.18);
}
.modal-content button{width:auto;padding:16px 42px;margin-top:20px;}
.hidden{display:none !important;}
.footer-time{
    position:fixed;left:0;bottom:0;width:100%;padding:18px;
    background:rgba(255,255,255,0.75);backdrop-filter:blur(20px);
    border-top:1px solid var(--glass-border);font-size:13px;color:var(--text-sub);z-index:998;
}
.toast-tip{
    position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);
    background:rgba(30,30,50,0.75);color:#fff;padding:22px 40px;border-radius:20px;
    z-index:99999;
}
.admin-table{
    width:100%;border-collapse:collapse;margin:26px 0;
}
.admin-table th,.admin-table td{
    padding:18px;border:1px solid var(--glass-border);color:var(--text-sub);font-size:14px;
    background:rgba(255,255,255,0.6);
}
.admin-table th{background:rgba(67,122,255,0.08);}
.notice-box{
    background:rgba(255,255,255,0.65);border:1px solid var(--glass-border);
    border-radius:26px;padding:26px;margin-bottom:32px;color:var(--text-sub);font-size:16px;line-height:1.85;
}
/* 管理员登录按钮样式 */
#adminEntryBtn{
    width:auto;
    padding:10px 14px;
    margin:0;
    font-size:14px;
    white-space:nowrap;
}
#adminErrorText{
    color:red;
    margin:10px 0;
    display:none;
}
</style>
</head>
<body>
<div class="footer-time">
    本站累计运行时长：<span id="totalRunTime">0天0时0分0秒</span>
</div>
<div id="toastContainer"></div>
<div id="welcomeModal" class="modal-wrap hidden">
    <div class="modal-content">
        <h3>👋 欢迎使用音色工具箱</h3>
        <button class="btn-blue" id="closeWelcome">开始使用</button>
    </div>
</div>
<div id="adminSuccessModal" class="modal-wrap hidden">
    <div class="modal-content">
        <h3>👑 管理员登录成功</h3>
        <button class="btn-blue" id="closeAdminTip">确定</button>
    </div>
</div>
<div id="resetPwdModal" class="modal-wrap hidden">
    <div class="modal-content">
        <h3>🔑 密保重置密码</h3>
        <input type="text" id="resetAcc" placeholder="注册账号">
        <input type="text" id="resetQ" placeholder="密保问题">
        <input type="text" id="resetA" placeholder="密保答案">
        <input type="password" id="newPwdInput" placeholder="新密码">
        <input type="password" id="newPwd2Input" placeholder="确认新密码">
        <button id="submitReset" class="btn-blue">确认重置</button>
        <button id="closeResetModal" class="btn-gray">取消</button>
    </div>
</div>
<!-- 管理员登录弹窗 新增 -->
<div id="adminLoginPopup" class="modal-wrap hidden">
    <div class="modal-content">
        <h3>👑 管理员后台登录</h3>
        <input type="text" id="adminInputAcc" placeholder="管理员账号">
        <input type="password" id="adminInputPwd" placeholder="管理员密码">
        <div id="adminErrorText"></div>
        <button id="adminSubmitLogin" class="btn-blue">进入管理后台</button>
        <button id="closeAdminPopup" class="btn-gray">关闭</button>
    </div>
</div>

<div id="authWrap" class="glass-card">
    <h1>🎵 小禾 AI 音色工具箱</h1>
    <div class="notice-box">
        注册规则：<br>
        1. 无需邮箱，账号4-16位字母数字，禁止纯数字<br>
        2. 密码禁止123456/111111等简单弱密码<br>
        3. 单IP20分钟最多注册5个账号<br>
        4. 忘记密码可通过密保问题重置
    </div>
    <!-- 登录/注册切换 + 管理员按钮 -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;gap:12px;">
        <div class="tab-group" style="display:flex;flex:1;">
            <div id="tabLogin" class="tab-item active">登录</div>
            <div id="tabReg" class="tab-item">注册</div>
        </div>
        <button id="adminEntryBtn" class="btn-blue">管理员登录</button>
    </div>

    <div id="loginFormWrap">
        <input type="text" id="loginUserInput" placeholder="账号（字母+数字，禁止纯数字）">
        <input type="password" id="loginPwdInput" placeholder="密码">
        <div class="code-row">
            <input type="text" id="loginCodeInput" placeholder="验证码" maxlength="4">
            <div class="code-img-box">
                <canvas id="loginCodeCanvas"></canvas>
                <span class="code-refresh" onclick="drawLoginCode()">换一张</span>
            </div>
        </div>
        <div style="text-align: right; margin: 14px 4px;">
            <span id="openResetModalBtn" style="color: var(--primary); font-size:14px; cursor:pointer;">忘记密码？</span>
        </div>
        <button id="loginSubmitBtn" class="btn-blue">登录</button>
        <button class="btn-purple" onclick="window.open('https://qm.qq.com/q/RNPgd1P3Wg')">📞 联系客服</button>
    </div>
    <div id="regFormWrap" class="hidden">
        <input type="text" id="regUserInput" placeholder="账号（必须字母+数字，不能纯数字）">
        <input type="password" id="regPwdInput" placeholder="密码">
        <input type="password" id="regPwd2Input" placeholder="确认密码">
        <input type="text" id="regQInput" placeholder="自定义密保问题">
        <input type="text" id="regAInput" placeholder="密保答案">
        <div class="code-row">
            <input type="text" id="regCodeInput" placeholder="验证码" maxlength="4">
            <div class="code-img-box">
                <canvas id="regCodeCanvas"></canvas>
                <span class="code-refresh" onclick="drawRegCode()">换一张</span>
            </div>
        </div>
        <button id="regSubmitBtn" class="btn-blue">注册</button>
        <button class="btn-purple" onclick="window.open('https://qm.qq.com/q/RNPgd1P3Wg')">📞 联系客服</button>
    </div>
</div>
<div id="userToolWrap" class="box hidden">
    <div class="glass-card">
        <h2>🎵 音色工具箱</h2>
        <input type="text" id="apiKeyInput" placeholder="输入302AI API Key">
        <input type="text" id="toneNameInput" placeholder="自定义音色名称（上传前填写）">
        <input type="text" id="toneIdInput" placeholder="音色ID（上传自动填充）">
        <button class="btn-blue" onclick="uploadAudioVoice()">1. 上传音色训练</button>
        <button class="btn-green" onclick="queryToneById()">2. ID查询音色状态</button>
        <button class="btn-purple" onclick="openDeleteConfirm()">3. 删除指定音色</button>
        <button class="btn-red" onclick="loadAllToneList()">4. 加载账号全部音色</button>
        <button class="btn-purple" onclick="openQQChat()">联系客服</button>
        <div class="del-row" id="deleteConfirmRow" style="display: none;">
            <button class="btn-red" onclick="confirmDeleteTone()">✅ 永久删除</button>
            <button class="btn-gray" onclick="cancelDeleteTone()">❌ 取消</button>
        </div>
        <button class="btn-gray" onclick="logoutCurrentUser()">退出登录</button>
        <div id="logBox">等待操作...</div>
    </div>
</div>
<div id="adminBackWrap" class="glass-card hidden">
    <h2>👑 管理员后台管理</h2>
    <p>平台总注册用户：<span id="totalUserCount">0</span></p>
    <table class="admin-table">
        <thead>
            <tr>
                <th>账号</th>
                <th>注册时间</th>
                <th>音色数量</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="userTableBody"></tbody>
    </table>
    <button class="btn-gray" onclick="logoutCurrentUser()">退出登录</button>
</div>
<input type="file" id="audioFileSelector" accept="audio/*" style="display: none;">
<script>
const API_BASE_URL = "";
const AI_API_HOST = "https://api.302ai.cn";
let loginAccount = "";
const LOCAL_IP_KEY = "ip_reg_limit_store";
let loginCode = "";
let regCode = "";
const charList = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789";
const ADMIN_ACCOUNT_ENV = "a1585546839";

function drawLoginCode(){
    const canvas = document.getElementById("loginCodeCanvas");
    if(!canvas) return;
    const ctx = canvas.getContext("2d");
    canvas.width = 130;
    canvas.height = 52;
    loginCode = "";
    for(let i = 0; i < 4; i++) loginCode = loginCode + charList[Math.floor(Math.random() * charList.length)];
    ctx.fillStyle = "#e8f0ff";
    ctx.fillRect(0, 0, 130, 52);
    for(let i = 0; i < 4; i++){
        ctx.font = "bold 30px system-ui";
        ctx.fillStyle = `hsl(${Math.random() * 360}, 68%, 42%)`;
        ctx.save();
        ctx.translate(28 + i * 26, 34);
        ctx.rotate((Math.random() - 0.5) * 0.42);
        ctx.fillText(loginCode[i], 0, 0);
        ctx.restore();
    }
    for(let i = 0; i < 5; i++){
        ctx.strokeStyle = `rgba(30,70,150,0.38)`;
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(Math.random()*130,Math.random()*52);
        ctx.lineTo(Math.random()*130,Math.random()*52);
        ctx.stroke();
    }
    for(let i = 0; i < 36; i++){
        ctx.fillStyle = "rgba(40,80,160,0.28)";
        ctx.fillRect(Math.random()*130,Math.random()*52,2,2);
    }
}
function drawRegCode(){
    const canvas = document.getElementById("regCodeCanvas");
    if(!canvas) return;
    const ctx = canvas.getContext("2d");
    canvas.width = 130;
    canvas.height = 52;
    regCode = "";
    for(let i = 0; i < 4; i++) regCode = regCode + charList[Math.floor(Math.random() * charList.length)];
    ctx.fillStyle = "#e8f0ff";
    ctx.fillRect(0, 0, 130, 52);
    for(let i = 0; i < 4; i++){
        ctx.font = "bold 30px system-ui";
        ctx.fillStyle = `hsl(${Math.random() * 360}, 68%, 42%)`;
        ctx.save();
        ctx.translate(28 + i * 26, 34);
        ctx.rotate((Math.random() - 0.5) * 0.42);
        ctx.fillText(regCode[i], 0, 0);
        ctx.restore();
    }
    for(let i = 0; i < 5; i++){
        ctx.strokeStyle = `rgba(30,70,150,0.38)`;
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(Math.random()*130,Math.random()*52);
        ctx.lineTo(Math.random()*130,Math.random()*52);
        ctx.stroke();
    }
    for(let i = 0; i < 36; i++){
        ctx.fillStyle = "rgba(40,80,160,0.28)";
        ctx.fillRect(Math.random()*130,Math.random()*52,2,2);
    }
}
function showToastMessage(text){
    const container = document.getElementById("toastContainer");
    container.innerHTML = `<div class="toast-tip">${text}</div>`;
    setTimeout(()=> container.innerHTML = "", 2200);
}
function openModalById(id){document.getElementById(id).classList.remove("hidden");}
function closeModalById(id){document.getElementById(id).classList.add("hidden");}
function hideAllPagePanels(){
    document.getElementById("authWrap").classList.remove("hidden");
    document.getElementById("userToolWrap").classList.add("hidden");
    document.getElementById("adminBackWrap").classList.add("hidden");
}
function showUserToolPanel(){
    document.getElementById("authWrap").classList.add("hidden");
    document.getElementById("userToolWrap").classList.remove("hidden");
}
function showAdminPanel(){
    document.getElementById("authWrap").classList.add("hidden");
    document.getElementById("adminBackWrap").classList.remove("hidden");
    renderAllUserTable();
}
function checkWeakPassword(pwd){
    const pureNumReg = /^\d+$/;
    const repeatNumReg = /^(\d)\1{5}/;
    const weakPwdList = ["123456","654321","111111","000000"];
    return pureNumReg.test(pwd) || repeatNumReg.test(pwd) || weakPwdList.includes(pwd);
}
function getIpRegisterRecord(){
    const cacheStr = localStorage.getItem(LOCAL_IP_KEY);
    return cacheStr ? JSON.parse(cacheStr) : {count:0, lockEnd:0};
}
function saveIpRecord(obj){
    localStorage.setItem(LOCAL_IP_KEY, JSON.stringify(obj));
}
document.getElementById("tabLogin").onclick = ()=>{
    document.getElementById("tabLogin").classList.add("active");
    document.getElementById("tabReg").classList.remove("active");
    document.getElementById("loginFormWrap").classList.remove("hidden");
    document.getElementById("regFormWrap").classList.add("hidden");
}
document.getElementById("tabReg").onclick = ()=>{
    document.getElementById("tabReg").classList.add("active");
    document.getElementById("tabLogin").classList.remove("active");
    document.getElementById("regFormWrap").classList.remove("hidden");
    document.getElementById("loginFormWrap").classList.add("hidden");
}
document.getElementById("openResetModalBtn").onclick = ()=> openModalById("resetPwdModal");
document.getElementById("closeResetModal").onclick = ()=> closeModalById("resetPwdModal");
document.getElementById("closeWelcome").onclick = ()=> closeModalById("welcomeModal");
document.getElementById("closeAdminTip").onclick = ()=> closeModalById("adminSuccessModal");

// -------------------------- 1、登录按钮事件（已按截图修改接口 /login） --------------------------
document.getElementById("loginSubmitBtn").onclick = async ()=>{
    const acc = document.getElementById("loginUserInput").value.trim();
    const pwd = document.getElementById("loginPwdInput").value.trim();
    const codeVal = document.getElementById("loginCodeInput").value.trim();

    // 普通用户校验验证码
    if(acc !== ADMIN_ACCOUNT_ENV){
        if(codeVal.toLowerCase() !== loginCode.toLowerCase()){
            showToastMessage("验证码错误，请重新输入");
            drawLoginCode();
            document.getElementById("loginCodeInput").value = "";
            return;
        }
    }
    
    // 接口已修改：原 /userLogin 改为 /login
    const res = await fetch(`${API_BASE_URL}/login`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({account:acc, password:pwd})
    });
    const data = await res.json();
    showToastMessage(data.msg);
    drawLoginCode();
    document.getElementById("loginCodeInput").value = "";
    if(data.code === 200){
        loginAccount = acc;
        if(data.isAdmin === true){
            showAdminPanel();
            openModalById("adminSuccessModal");
        }else{
            showUserToolPanel();
            openModalById("welcomeModal");
        }
    }
}

// 注册逻辑
document.getElementById("regSubmitBtn").onclick = async ()=>{
    const record = getIpRegisterRecord();
    const now = Date.now();
    if(record.lockEnd > now){
        const waitMin = Math.ceil((record.lockEnd - now) / 60000);
        return showToastMessage(`IP注册受限，请等待${waitMin}分钟`);
    }
    if(record.count >= 5){
        saveIpRecord({count:5, lockEnd: now + 1200000});
        return showToastMessage("当前IP20分钟注册已达上限");
    }
    const account = document.getElementById("regUserInput").value.trim();
    const pwd = document.getElementById("regPwdInput").value.trim();
    const pwd2 = document.getElementById("regPwd2Input").value.trim();
    const q = document.getElementById("regQInput").value.trim();
    const ans = document.getElementById("regAInput").value.trim();
    const codeVal = document.getElementById("regCodeInput").value.trim();
    if(codeVal.toLowerCase() !== regCode.toLowerCase()){
        showToastMessage("验证码错误，请重新输入");
        drawRegCode();
        document.getElementById("regCodeInput").value = "";
        return;
    }
    const accRule = /^[a-zA-Z0-9]{4,16}$/;
    if(!accRule.test(account) || /^\d+$/.test(account)) return showToastMessage("账号格式错误！禁止纯数字，必须字母+数字组合");
    if(pwd !== pwd2) return showToastMessage("两次输入密码不一致");
    if(checkWeakPassword(pwd)) return showToastMessage("请勿使用简单弱密码");
    if(q.length <4 || ans.length <2) return showToastMessage("密保问题/答案填写完整");
    const res = await fetch(`${API_BASE_URL}/register`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({account:account, password:pwd, q:q, a:ans, code:codeVal})
    });
    const data = await res.json();
    showToastMessage(data.msg);
    drawRegCode();
    document.getElementById("regCodeInput").value = "";
    if(data.code === 200){
        saveIpRecord({count: record.count + 1, lockEnd:0});
        document.getElementById("tabLogin").click();
    }
}

function appendLog(text){
    const logBox = document.getElementById("logBox");
    const now = new Date().toLocaleTimeString();
    logBox.textContent += `\n[${now}] ${text}`;
}
function clearLogText(text){
    document.getElementById("logBox").textContent = text;
}
function copyText(text){
    const input = document.createElement("input");
    input.style.opacity = "0";
    input.style.position = "fixed";
    input.value = text;
    document.body.appendChild(input);
    input.select();
    document.execCommand("copy");
    document.body.removeChild(input);
}
function openQQChat(){
    window.open("https://qm.qq.com/q/RNPgd1P3Wg", "_blank");
}
async function uploadAudioVoice(){
    const key = document.getElementById("apiKeyInput").value.trim();
    const name = document.getElementById("toneNameInput").value.trim();
    if(!key) return clearLogText("⚠️ 请先填写302AI API Key");
    if(!name) return clearLogText("⚠️ 请填写自定义音色名称");
    const fileDom = document.createElement("input");
    fileDom.type = "file";
    fileDom.accept = "audio/*";
    fileDom.onchange = async (e)=>{
        const file = e.target.files[0];
        if(!file) return;
        appendLog(`选中音频：${file.name}，音色名：${name}`);
        clearLogText("正在提交音色训练请求...");
        const form = new FormData();
        form.append("type", "tts");
        form.append("title", name);
        form.append("train_mode", "fast");
        form.append("visibility", "private");
        form.append("voices", file);
        try{
            const resp = await fetch(`${AI_API_HOST}/fish-audio/model`,{
                method:"POST",
                headers: { Authorization: "Bearer " + key },
                body: form
            });
            if(!resp.ok) throw new Error(`接口状态码${resp.status}`);
            const resData = await resp.json();
            const tid = resData._id;
            copyText(tid);
            document.getElementById("toneIdInput").value = tid;
            clearLogText(`✅ 音色上传成功\n名称：${name}\nID：${tid}\nID已自动复制剪贴板`);
        }catch(err){
            clearLogText(`❌ 上传失败：${err.message}\n核对API密钥/音频文件/网络`);
        }
    };
    fileDom.click();
}
async function queryToneById(){
    const key = document.getElementById("apiKeyInput").value.trim();
    const tid = document.getElementById("toneIdInput").value.trim();
    if(!key) return clearLogText("⚠️ 请填写API Key");
    if(!tid) return clearLogText("⚠️ 输入音色ID");
    clearLogText("正在拉取音色信息...");
    try{
        const resp = await fetch(`${AI_API_HOST}/fish-audio/model/${tid}`,{
            headers: { Authorization: "Bearer " + key }
        });
        if(!resp.ok) throw new Error(`查询失败，状态码${resp.status}`);
        const d = await resp.json();
        const state = d.state === "trained" ? "✅训练完成" : d.state === "training" ? "⚙️训练中" : "⏳排队";
        clearLogText(`✅ 查询成功\n名称：${d.title}\n状态：${state}\nID：${d._id}`);
    }catch(err){
        clearLogText(`❌ 查询失败：${err.message}`);
    }
}
function openDeleteConfirm(){
    const tid = document.getElementById("toneIdInput").value.trim();
    if(!tid) return clearLogText("⚠️ 请先输入音色ID");
    clearLogText(`即将删除音色ID：${tid}\n点击确认按钮永久移除`);
    document.getElementById("deleteConfirmRow").style.display = "flex";
}
async function confirmDeleteTone(){
    document.getElementById("deleteConfirmRow").style.display = "none";
    const key = document.getElementById("apiKeyInput").value.trim();
    const tid = document.getElementById("toneIdInput").value.trim();
    clearLogText("正在发送删除指令...");
    try{
        const resp = await fetch(`${AI_API_HOST}/fish-audio/model/${tid}`,{
            method:"DELETE",
            headers: {
                "Authorization": "Bearer " + key,
                "Content-Type": "application/json"
            }
        });
        if(!resp.ok) throw new Error(`异常状态码${resp.status}`);
        clearLogText("✅ 删除成功，该音色已永久移除");
    }catch(err){
        clearLogText(`❌ 删除失败：${err.message}\n排查密钥权限/ID有效性`);
    }
}
function cancelDeleteTone(){
    document.getElementById("deleteConfirmRow").style.display = "none";
    clearLogText("已取消删除操作");
}
async function loadAllToneList(){
    const key = document.getElementById("apiKeyInput").value.trim();
    if(!key) return clearLogText("⚠️ 请填写API Key");
    clearLogText("正在加载账号全部音色...");
    let list = [], page = 1, errFlag = false;
    while(true){
        try{
            const resp = await fetch(`${AI_API_HOST}/fish-audio/model?page_size=50&page_number=${page}`,{
                headers: { Authorization: "Bearer " + key }
            });
            if(!resp.ok) throw new Error(`第${page}页加载失败`);
            const d = await resp.json();
            if(!d.items?.length) break;
            list.push(...d.items);
            page++;
        }catch(err){
            errFlag = true;
            appendLog(`分页${page}异常：${err.message}`);
            break;
        }
    }
    if(list.length === 0) return clearLogText("当前账号暂无音色");
    let showStr = `✅ 共获取${list.length}个音色\n\n`;
    list.forEach((item, idx)=>{
        const tag = item.state === "trained" ? "✅完成" : item.state === "training" ? "⚙️训练中" : "⏳排队";
        showStr += `${idx+1}. 名称：${item.title}\nID：${item._id}\n状态：${tag}\n------------------------\n`;
    });
    if(errFlag) showStr += "\n⚠️ 部分分页加载异常，列表不完整";
    clearLogText(showStr);
}
function runTimer(){
    let sec = 0;
    setInterval(()=>{
        const day = Math.floor(sec / 86400);
        const h = Math.floor((sec % 86400) / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = sec % 60;
        document.getElementById("totalRunTime").innerText = `${day}天${h}时${m}分${s}`;
        sec++;
    }, 1000);
}

const adminEntryBtn = document.getElementById("adminEntryBtn");
const adminLoginPopup = document.getElementById("adminLoginPopup");
const closeAdminPopup = document.getElementById("closeAdminPopup");
const adminSubmitLogin = document.getElementById("adminSubmitLogin");
const adminErrorText = document.getElementById("adminErrorText");

adminEntryBtn.onclick = () => {
    adminLoginPopup.classList.remove("hidden");
    adminErrorText.style.display = "none";
    document.getElementById("adminInputAcc").value = "";
    document.getElementById("adminInputPwd").value = "";
}
closeAdminPopup.onclick = () => {
    adminLoginPopup.classList.add("hidden");
}

adminSubmitLogin.onclick = async () => {
    const inputAcc = document.getElementById("adminInputAcc").value.trim();
    const inputPwd = document.getElementById("adminInputPwd").value.trim();
    adminErrorText.style.display = "none";

    const res = await fetch(`${API_BASE_URL}/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ account: inputAcc, password: inputPwd })
    })
    const data = await res.json();
    if(data.code !== 200){
        adminErrorText.innerText = data.msg;
        adminErrorText.style.display = "block";
        return;
    }
    closeAdminPopup.click();

    showAdminPanel();
    openModalById("adminSuccessModal");
}
