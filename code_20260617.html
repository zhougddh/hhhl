<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小禾语音工具箱</title>
<style>
:root{--bg:#0b0e1b;--card:rgba(255,255,255,0.08);--border:rgba(255,255,255,0.12);--text:#eee;--primary:#10b981;--warn:#f59e0b;--danger:#f56c6c}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:sans-serif;min-height:100vh;padding:15px;padding-bottom:70px;position:relative}
.glass{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:18px;padding:20px;margin:10px auto;max-width:580px}
.notice{background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.3);border-radius:12px;padding:12px;margin-bottom:15px;color:#fcd34d;font-size:14px;line-height:1.5}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:9999}
.modal-content{background:#1a2035;border-radius:18px;padding:25px;width:90%;max-width:400px;text-align:center;border:1px solid var(--border)}
.modal-content h3{margin-bottom:15px;color:#fcd34d}
.modal-content button{width:auto;padding:10px 25px;margin:0}
.hidden{display:none !important}
input{width:100%;padding:14px;margin:8px 0;background:rgba(255,255,255,0.07);border:1px solid var(--border);border-radius:12px;color:#fff;font-size:16px}
button{width:100%;padding:14px;margin:8px 0;border:none;border-radius:12px;background:linear-gradient(135deg,var(--primary),#059669);color:#fff;font-weight:bold;pointer-events:auto !important;cursor:pointer;font-size:16px}
button:active{opacity:0.85;transform:scale(0.98);}
.btn-kefu{background:linear-gradient(135deg,#7928ca,#a855f7)}
.btn-danger{background:var(--danger)}
.btn-gray{background:#374151}
.btn-mini{width:auto;padding:6px 10px;margin:2px;pointer-events:auto !important;font-size:14px}
#logBox{min-height:160px;padding:15px;background:rgba(255,255,255,0.07);border-radius:14px;margin-top:15px;white-space:pre-wrap}
h1,h2{text-align:center;margin-bottom:15px}
.admin-table{width:100%;border-collapse:collapse;margin:15px 0}
.admin-table th,.admin-table td{padding:10px;border:1px solid var(--border);text-align:left;font-size:14px}
.admin-table th{background:rgba(255,255,255,0.1)}
.tab-bar{display:flex;margin:15px 0;border-radius:12px;overflow:hidden}
.tab{flex:1;padding:12px;text-align:center;background:rgba(255,255,255,0.05);cursor:pointer;pointer-events:auto !important}
.tab:active{opacity:0.75;}
.tab.active{background:rgba(16,185,129,0.25);color:#34d399;font-weight:bold}
.run-time-footer{
    position:fixed;
    left:0;
    bottom:0;
    width:100%;
    padding:12px;
    text-align:center;
    background:#121726;
    border-top:1px solid var(--border);
    font-size:14px;
    color:#cccccc;
    z-index:999;
}
.toast{
    position:fixed;
    top:40%;
    left:50%;
    transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.85);
    color:#fff;
    padding:14px 24px;
    border-radius:10px;
    font-size:15px;
    z-index:99999;
    max-width:85%;
    text-align:center;
}
.code-row{display:flex;gap:8px;}
.code-row input{flex:1;margin:0;}
.code-row button{width:120px;margin:0;}
</style>
</head>
<body>
<div id="toastWrap"></div>
<div class="run-time-footer">
    本站累计运行时长：<span id="totalRunTime">0天0时0分0秒</span>
</div>
<div id="modalNotice" class="modal hidden">
  <div class="modal-content">
    <h3>📢 公告</h3>
    <p>管理员登录成功</p>
    <button id="closeNoticeBtn">知道了</button>
  </div>
</div>
<div id="pwdModal" class="modal hidden">
  <div class="modal-content">
    <h3>🔐 管理员账号密码</h3>
    <p>账号：1585546839</p>
    <p id="showAdminPwd"></p>
    <button id="closePwdBtn">关闭</button>
  </div>
</div>
<div id="forgetModal" class="modal hidden">
  <div class="modal-content">
    <h3>🔑 重置密码</h3>
    <input type="text" id="resetUser" placeholder="注册账号">
    <input type="text" id="resetEmail" placeholder="绑定邮箱">
    <div class="code-row">
        <input type="text" id="resetCode" placeholder="邮箱验证码">
        <button id="sendResetCodeBtn">获取验证码</button>
    </div>
    <input type="password" id="newPwd" placeholder="新密码">
    <input type="password" id="newPwd2" placeholder="确认新密码">
    <button id="submitResetBtn">确认重置</button>
    <button id="closeForgetBtn">取消</button>
  </div>
</div>
<div id="changeMailModal" class="modal hidden">
  <div class="modal-content">
    <h3>📧 更换绑定邮箱</h3>
    <input type="text" id="newBindEmail" placeholder="新邮箱地址">
    <div class="code-row">
        <input type="text" id="newMailCode" placeholder="验证码">
        <button id="sendNewMailCodeBtn">获取验证码</button>
    </div>
    <button id="submitChangeMailBtn">确认更换</button>
    <button id="closeChangeMailBtn">取消</button>
  </div>
</div>
<div id="auth" class="glass">
  <h1>🎵 小禾语音工具箱</h1>
  <div class="notice">
    📢 公告：<br>
    1. 音色训练高峰期，上传可能排队，请耐心等待<br>
    2. 遇到问题请点击下方联系客服，工作日秒回
  </div>
  <div class="tab-bar">
    <div id="loginTab" class="tab active">登录</div>
    <div id="regTab" class="tab">注册</div>
  </div>
  <div id="loginForm">
    <input type="text" id="loginUser" placeholder="账号">
    <input type="password" id="loginPwd" placeholder="密码">
    <div style="text-align:right;margin:4px 0;">
        <span id="openForgetBtn" style="color:#7cf;cursor:pointer;font-size:14px;">忘记密码？</span>
    </div>
    <button id="loginBtn">登录</button>
    <button class="btn-kefu" id="loginKefuBtn">📞 联系客服</button>
  </div>
  <div id="regForm" class="hidden">
    <input type="text" id="regUser" placeholder="账号（4-16位字母+数字，禁止纯数字/连续简单字符）">
    <input type="password" id="regPwd" placeholder="密码（6-20位，不可与账号相同，禁止简单连续数字）">
    <input type="password" id="regPwd2" placeholder="确认密码">
    <input type="text" id="regEmail" placeholder="绑定邮箱（用于找回密码）">
    <div class="code-row">
        <input type="text" id="regMailCode" placeholder="邮箱验证码">
        <button id="sendRegCodeBtn">获取验证码</button>
    </div>
    <button id="regSubmitBtn">注册</button>
    <button class="btn-kefu" id="regKefuBtn">📞 联系客服</button>
  </div>
</div>
<div id="userPanel" class="glass hidden">
  <h2>🎵 音色工具箱</h2>
  <input type="text" id="apiKey" placeholder="API Key">
  <input type="text" id="customName" placeholder="音色名称">
  <input type="text" id="voiceId" placeholder="音色ID">
  <button id="uploadBtn">上传音色</button>
  <button id="queryBtn">查询音色</button>
  <button id="delVoiceBtn">删除音色</button>
  <button id="loadAllBtn">加载全部</button>
  <button class="btn-kefu" id="userKefuBtn">📞 联系客服</button>
  <button id="openChangeMailBtn">📧 更换绑定邮箱</button>
  <button class="btn-gray" id="logoutUserBtn">退出登录</button>
  <div id="logBox">等待操作...</div>
</div>
<div id="adminPanel" class="glass hidden">
  <h2>👑 管理员后台（账号1585546839）</h2>
  <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap;">
    <p>平台总注册用户：<span id="userCount">0</span></p>
    <button class="btn-mini" id="showPwdBtn">查看管理员密码</button>
  </div>
  <div class="tab-bar">
    <div class="tab active" id="tabUserList">全部用户管理</div>
    <div class="tab" id="tabSearchUser">搜索用户详情</div>
  </div>
  <div id="userListTab">
    <table class="admin-table">
      <thead>
        <tr>
          <th>用户账号</th>
          <th>绑定邮箱</th>
          <th>注册时间</th>
          <th>音色总数</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="userListBody"></tbody>
    </table>
  </div>
  <div id="userDetailTab" class="hidden">
    <input type="text" id="searchUser" placeholder="输入账号搜索用户">
    <button id="searchUserBtn">搜索查看</button>
    <div id="userDetailInfo" style="margin-top:15px;"></div>
  </div>
  <button class="btn-gray" id="logoutAdminBtn">退出登录</button>
</div>
<script>
const QQ_CUSTOMER_URL = "https://qm.qq.com/cgi-bin/qm/qr?k=UIo3rLQpeH0mXqa1C8fmzdlryYhTIoVp";
const API_HOST = "https://api.302ai.cn";
const DB_KEY = "nexus_voice_system_db";
const RUN_TIME_KEY = "system_run_start_timestamp";
let db = {};
let currentLoginUser = null;
let emailCodeCache = {};
// 页面加载强制清空旧缓存，彻底解决旧数据冲突
window.onload = function(){
    localStorage.clear();
    loadDB();
    initRunTime();
    showAuthPanel();
}
function loadDB(){
    db = {
      users: {},
      adminPwd: "1585546839zz",
      voices: {}
    };
    saveDB();
}
function saveDB(){
  localStorage.setItem(DB_KEY, JSON.stringify(db));
}
function showToast(msg) {
    const wrap = document.getElementById("toastWrap");
    wrap.innerHTML = `<div class="toast">${msg}</div>`;
    setTimeout(()=>{ wrap.innerHTML = ""; }, 2200);
}
function hashStr(str) {
    let hash = 0;
    for(let i=0;i<str.length;i++){
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash |= 0;
    }
    return hash.toString(16);
}
function initRunTime(){
    localStorage.setItem(RUN_TIME_KEY, Date.now().toString());
    updateRunTime();
    setInterval(updateRunTime, 1000);
}
function updateRunTime(){
    const startTs = parseInt(localStorage.getItem(RUN_TIME_KEY));
    const diff = Date.now() - startTs;
    const s = Math.floor(diff / 1000);
    const day = Math.floor(s / 86400);
    const h = Math.floor((s % 86400) / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    document.getElementById("totalRunTime").innerText = `${day}天${h}时${m}分${sec}秒`;
}
function hideAllPanel(){
    document.getElementById("auth").classList.add("hidden");
    document.getElementById("userPanel").classList.add("hidden");
    document.getElementById("adminPanel").classList.add("hidden");
}
function showAuthPanel(){
    hideAllPanel();
    document.getElementById("auth").classList.remove("hidden");
    currentLoginUser = null;
}
function showUserPanel(user){
    hideAllPanel();
    document.getElementById("userPanel").classList.remove("hidden");
    currentLoginUser = user;
    document.getElementById("logBox").innerText = `欢迎 ${user.account}，操作日志：\n等待操作...`;
}
function showAdminPanel(){
    hideAllPanel();
    document.getElementById("adminPanel").classList.remove("hidden");
    currentLoginUser = "1585546839";
    renderUserList();
}
document.getElementById("loginTab").onclick = ()=>{
    document.getElementById("loginTab").classList.add("active");
    document.getElementById("regTab").classList.remove("active");
    document.getElementById("loginForm").classList.remove("hidden");
    document.getElementById("regForm").classList.add("hidden");
};
document.getElementById("regTab").onclick = ()=>{
    document.getElementById("regTab").classList.add("active");
    document.getElementById("loginTab").classList.remove("active");
    document.getElementById("regForm").classList.remove("hidden");
    document.getElementById("loginForm").classList.add("hidden");
};
document.getElementById("tabUserList").onclick = ()=>{
    document.getElementById("tabUserList").classList.add("active");
    document.getElementById("tabSearchUser").classList.remove("active");
    document.getElementById("userListTab").classList.remove("hidden");
    document.getElementById("userDetailTab").classList.add("hidden");
};
document.getElementById("tabSearchUser").onclick = ()=>{
    document.getElementById("tabSearchUser").classList.add("active");
    document.getElementById("tabUserList").classList.remove("active");
    document.getElementById("userDetailTab").classList.remove("hidden");
    document.getElementById("userListTab").classList.add("hidden");
};
function openModal(id){
    document.getElementById(id).classList.remove("hidden");
}
function closeModal(id){
    document.getElementById(id).classList.add("hidden");
}
document.getElementById("closeNoticeBtn").onclick = ()=> closeModal("modalNotice");
document.getElementById("closePwdBtn").onclick = ()=> closeModal("pwdModal");
document.getElementById("openForgetBtn").onclick = ()=> openModal("forgetModal");
document.getElementById("closeForgetBtn").onclick = ()=> closeModal("forgetModal");
document.getElementById("openChangeMailBtn").onclick = ()=> openModal("changeMailModal");
document.getElementById("closeChangeMailBtn").onclick = ()=> closeModal("changeMailModal");
document.querySelectorAll(".btn-kefu").forEach(btn=>{
    btn.onclick = ()=> window.open(QQ_CUSTOMER_URL);
});
document.getElementById("showPwdBtn").onclick = ()=>{
    document.getElementById("showAdminPwd").innerText = `密码：${db.adminPwd}`;
    openModal("pwdModal");
};
document.getElementById("logoutUserBtn").onclick = ()=>{
    showToast("已退出登录");
    showAuthPanel();
};
document.getElementById("logoutAdminBtn").onclick = ()=>{
    showToast("管理员已登出");
    showAuthPanel();
};
function checkUserRule(account, pwd){
    const accReg = /^[a-zA-Z0-9]{4,16}$/;
    const allNumAcc = /^\d+$/;
    if(!accReg.test(account)) return "账号必须4-16位字母数字组合";
    if(allNumAcc.test(account)) return "账号禁止纯数字";
    if(pwd.length <6 || pwd.length>20) return "密码长度6-20位";
    if(pwd === account) return "密码不能与账号一致";
    const seq1 = "123456", seq2 = "654321";
    if(pwd.includes(seq1) || pwd.includes(seq2)) return "密码禁止连续简单数字序列";
    return "";
}
document.getElementById("regSubmitBtn").onclick = ()=>{
    const acc = document.getElementById("regUser").value.trim();
    const pwd = document.getElementById("regPwd").value.trim();
    const pwd2 = document.getElementById("regPwd2").value.trim();
    const email = document.getElementById("regEmail").value.trim();
    const code = document.getElementById("regMailCode").value.trim();
    const ruleErr = checkUserRule(acc, pwd);
    if(ruleErr){showToast(ruleErr);return;}
    if(pwd !== pwd2){showToast("两次密码不一致");return;}
    if(!email) {showToast("请填写绑定邮箱");return;}
    const cacheCode = emailCodeCache[email];
    if(!cacheCode || cacheCode !== code){showToast("验证码错误或已过期");return;}
    if(db.users[acc]){showToast("该账号已被注册");return;}
    const now = new Date().toLocaleString();
    db.users[acc] = {
        account: acc,
        pwd: hashStr(pwd),
        email: email,
        regTime: now,
        voices: []
    };
    saveDB();
    showToast("注册成功，请登录");
    document.getElementById("loginTab").click();
};
document.getElementById("sendRegCodeBtn").onclick = function(){
    const email = document.getElementById("regEmail").value.trim();
    if(!email){showToast("请输入邮箱");return;}
    const code = Math.floor(100000 + Math.random()*900000).toString();
    emailCodeCache[email] = code;
    showToast(`模拟验证码：${code}`);
};
document.getElementById("sendResetCodeBtn").onclick = function(){
    const email = document.getElementById("resetEmail").value.trim();
    if(!email){showToast("请输入绑定邮箱");return;}
    const code = Math.floor(100000 + Math.random()*900000).toString();
    emailCodeCache[email] = code;
    showToast(`重置验证码：${code}`);
};
document.getElementById("sendNewMailCodeBtn").onclick = function(){
    const email = document.getElementById("newBindEmail").value.trim();
    if(!email){showToast("请输入新邮箱");return;}
    const code = Math.floor(100000 + Math.random()*900000).toString();
    emailCodeCache[email] = code;
    showToast(`换绑验证码：${code}`);
};
// 【无任何设备校验，直接登录管理员】
document.getElementById("loginBtn").onclick = ()=>{
    const acc = document.getElementById("loginUser").value.trim();
    const pwd = document.getElementById("loginPwd").value.trim();
    if(acc === "1585546839"){
        if(hashStr(pwd) !== hashStr(db.adminPwd)){
            showToast("管理员密码错误");
            return;
        }
        openModal("modalNotice");
        showAdminPanel();
        return;
    }
    const user = db.users[acc];
    if(!user){showToast("账号不存在");return;}
    if(user.pwd !== hashStr(pwd)){showToast("密码错误");return;}
    showUserPanel(user);
};
function appendLog(text){
    const box = document.getElementById("logBox");
    box.innerText += "\n" + text;
}
document.getElementById("uploadBtn").onclick = ()=>{
    const apiKey = document.getElementById("apiKey").value.trim();
    const name = document.getElementById("customName").value.trim();
    const vid = document.getElementById("voiceId").value.trim();
    if(!apiKey || !name || !vid){showToast("API Key、音色名称、音色ID不能为空");return;}
    appendLog(`[${new Date().toLocaleTimeString()}] 发起上传：${name}(${vid})`);
};
document.getElementById("queryBtn").onclick = ()=>{
    const vid = document.getElementById("voiceId").value.trim();
    if(!vid){showToast("请输入音色ID");return;}
    appendLog(`[${new Date().toLocaleTimeString()}] 查询音色ID：${vid}`);
};
document.getElementById("delVoiceBtn").onclick = ()=>{
    const vid = document.getElementById("voiceId").value.trim();
    if(!vid){showToast("请输入音色ID");return;}
    if(!confirm("确认删除该音色？")) return;
    appendLog(`[${new Date().toLocaleTimeString()}] 已请求删除音色：${vid}`);
};
document.getElementById("loadAllBtn").onclick = ()=>{
    appendLog(`[${new Date().toLocaleTimeString()}] 加载当前用户全部音色列表...`);
};
function renderUserList(){
    const tbody = document.getElementById("userListBody");
    const userArr = Object.values(db.users);
    document.getElementById("userCount").innerText = userArr.length;
    tbody.innerHTML = "";
    userArr.forEach(u=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${u.account}</td>
            <td>${u.email}</td>
            <td>${u.regTime}</td>
            <td>${u.voices.length}</td>
            <td><button class="btn-mini btn-danger" data-del="${u.account}">删除用户</button></td>
        `;
        tbody.appendChild(tr);
    });
    document.querySelectorAll("[data-del]").forEach(btn=>{
        btn.onclick = function(){
            const delAcc = this.dataset.del;
            if(!confirm(`确认删除用户 ${delAcc}？`)) return;
            delete db.users[delAcc];
            saveDB();
            renderUserList();
            showToast("用户已删除");
        };
    });
}
document.getElementById("searchUserBtn").onclick = ()=>{
    const targetAcc = document.getElementById("searchUser").value.trim();
    const infoBox = document.getElementById("userDetailInfo");
    const user = db.users[targetAcc];
    if(!user){
        infoBox.innerHTML = "<p style='color:#f56c6c'>未找到该用户</p>";
        return;
    }
    infoBox.innerHTML = `
        <p>账号：${user.account}</p>
        <p>绑定邮箱：${user.email}</p>
        <p>注册时间：${user.regTime}</p>
        <p>拥有音色数量：${user.voices.length}</p>
    `;
};
</script>
</body>
</html>
